<style>
  :root{--primary-color:#f3e9dc;--accent-color:#cbb07e;--gold:#cbb07e;--light-text:#d8cfc2;--bg-body:#1a1512;--bg-card:#2e2419;--bg-panel:#140f0c;--muted:#b7a88e;--border:rgba(203,176,126,0.16);--red:#b5553f;--green:#8a9a5b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'CMU Serif','Latin Modern Roman',Georgia,serif;color:var(--light-text);background:var(--bg-body);line-height:1.6}
  h1,h2,h3{font-family:'CMU Serif','Latin Modern Roman',Georgia,serif;font-weight:700;letter-spacing:.2px}
  .container{max-width:980px;margin:0 auto;padding:18px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px}
  html[data-lang="fr"] .lang-en{display:none}
  html[data-lang="en"] .lang-fr{display:none}
  aside{background:linear-gradient(160deg,#1e1713 0%,#140f0c 100%);color:#f1e7d9;border:1px solid var(--border);padding:22px 18px;border-radius:12px;height:fit-content;position:sticky;top:20px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-color);filter:sepia(.2) contrast(1.05) saturate(.85)}

  .brand .rl{font-size:.78rem;color:var(--muted)}

  .lang-switch button{font-family:'CMU Sans Serif','Latin Modern Sans',sans-serif;cursor:pointer;border:none;background:transparent;color:var(--muted);padding:4px 11px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.5px;transition:.2s}
  .lang-switch button.active{background:var(--accent-color);color:#1a1512}
  .sidelinks{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
  .slink{font-family:'CMU Sans Serif','Latin Modern Sans',sans-serif;font-size:.76rem;font-weight:700;letter-spacing:.3px;text-decoration:none;color:var(--accent-color);border:1px solid var(--border);border-radius:999px;padding:5px 11px;transition:.15s}
  .slink:hover{background:rgba(203,176,126,.08)}
  .slink.solid{background:var(--accent-color);color:#1a1512;border-color:var(--accent-color)}
  .pl-head{font-size:.8rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-family:'CMU Sans Serif','Latin Modern Sans',sans-serif;border-top:1px solid rgba(255,255,255,.1);padding-top:16px;margin-bottom:10px}
  #playlist{display:flex;flex-direction:column;gap:6px}
  .pl-item{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:rgba(203,176,126,.04);border:1px solid var(--border);border-radius:9px;padding:10px 12px;cursor:pointer;font-family:inherit;transition:.15s}
  .pl-item:hover{background:rgba(203,176,126,.1)}
  .pl-item.active{background:var(--accent-color);border-color:var(--accent-color)}
  .pl-item .pl-title{font-size:.98rem;font-weight:700;color:var(--primary-color)}
  .pl-item .pl-sub{font-size:.78rem;color:var(--muted)}
  .pl-item.active .pl-title,.pl-item.active .pl-sub,.pl-item.active .pl-arr{color:#1a1512}
  .pl-item .pl-arr{font-size:.74rem;color:var(--muted);font-style:italic;margin-top:1px}
  .pl-soon{font-size:.78rem;color:var(--muted);font-style:italic;padding:8px 4px 2px}
  .pl-item.disabled{opacity:.5;cursor:default;pointer-events:none}
  main{min-width:0}
  section{background:var(--bg-card);padding:26px;border-radius:12px;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .intro{color:var(--light-text);font-size:.95rem;margin-bottom:18px}
  .intro strong{color:var(--accent-color)}
  h2#mTitle{color:var(--primary-color);font-size:1.5rem;font-weight:600;margin-bottom:4px}
  h2#mTitle .subm{font-weight:400;color:var(--muted);font-size:1rem}
  #mMeta{font-size:13px;color:var(--light-text);margin-bottom:16px}
  .scorebox{background:#f4ecdd;border:1px solid var(--border);border-radius:10px;overflow-x:auto;overflow-y:hidden;position:relative;margin-bottom:14px;min-height:168px}
  .score{display:none}.score.on{display:block}
  .scorebox svg{height:168px;width:auto;display:block}
  .scorebox svg .note.active *{fill:#9c5a2a!important;stroke:#9c5a2a!important}
  #cursor{stroke:var(--red);stroke-width:90;opacity:.85}
  .ab{display:flex;gap:8px;background:var(--bg-panel);padding:6px;border-radius:10px;margin-bottom:14px;border:1px solid var(--border)}
  .ab button{flex:1;border:0;padding:13px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);transition:.15s;font-family:inherit}
  .ab button.real.on{background:var(--accent-color);color:#1a1512}
  .ab button.midi.on{background:var(--primary-color);color:#1a1512}
  .transport{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
  .trow{display:flex;align-items:center;gap:13px}
  .play{width:50px;height:50px;border-radius:50%;border:0;background:var(--accent-color);color:#1a1512;font-size:19px;cursor:pointer;flex:0 0 auto}
  .mini{background:var(--bg-card);border:1px solid var(--border);color:var(--light-text);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:13px;font-family:inherit}
  .mini.on{background:var(--accent-color);border-color:var(--accent-color);color:#1a1512}
  .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;background:var(--border);outline:none;flex:1}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent-color);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--accent-color)}
  .track{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:9px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .track.dim{opacity:.4}
  .tname{font-weight:600;font-size:14px;min-width:92px}
  .tsel{background:var(--bg-card);color:var(--light-text);border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-size:13px;font-weight:600;min-width:92px;font-family:inherit}
  .btn{border:1px solid var(--border);background:var(--bg-card);color:var(--muted);border-radius:8px;width:40px;height:34px;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit}
  .btn.mute.on{background:var(--red);border-color:var(--red);color:#fff}
  .btn.solo.on{background:var(--green);border-color:var(--green);color:#1a1512}
  .vol{max-width:160px}
  #status{font-size:12px;color:var(--muted);margin:4px 2px;min-height:15px;font-family:'CMU Sans Serif','Latin Modern Sans',sans-serif}
  @media (max-width:850px){.container{grid-template-columns:minmax(0,1fr)}aside{position:relative;top:0}}
  @media (max-width:600px){body{padding:10px}.container{padding:0;gap:14px}section{padding:15px}aside{padding:16px 14px}h2#mTitle{font-size:1.22rem}.scorebox svg{height:140px}.ab button{padding:11px;font-size:14px}.play{width:46px;height:46px;font-size:17px}.mini{padding:8px 10px}.trow{gap:9px}.track{padding:10px;gap:8px}.tname{min-width:0}.tsel{min-width:86px}.vol{max-width:none;flex:1 1 100%;margin-top:2px}}

function urlFor(i,bank){const v=voices()[i];if(v.kind==="toggle"){const o=v.options.find(o=>o.val===st.sel[i])||v.options[0];return o.files[bank];}return v.files[bank];}
function elFor(i,bank){return A[st.cfg][urlFor(i,bank)];}
function activeEls(){return voices().map((v,i)=>elFor(i,st.bank));}
function clockEl(){return activeEls()[0];}
function initAudio(){CFG.forEach(c=>{A[c.id]={};const urls=new Set();
  c.voices.forEach(v=>{if(v.kind==="toggle")v.options.forEach(o=>{urls.add(o.files.real);urls.add(o.files.midi);});else{urls.add(v.files.real);urls.add(v.files.midi);}});
  urls.forEach(u=>{totalAudio++;const a=new Audio();a.preload="auto";a.src=u;A[c.id][u]=a;
    a.addEventListener('loadedmetadata',()=>{loaded++;if(loaded>=totalAudio)setStatus("");});
    a.addEventListener('error',()=>setStatus("Erreur ("+u.split('/').pop()+")."));});});}
function pauseAll(){for(const id in A)for(const u in A[id]){try{A[id][u].pause();}catch(e){}}}
function applyGains(){const anySolo=st.tr.some(x=>x.solo);activeEls().forEach((e,i)=>{if(!e)return;const t=st.tr[i];const ok=(anySolo?t.solo:true)&&!t.muted;e.muted=!ok;e.volume=t.vol;});}
function curPos(){const c=clockEl();return st.playing&&c?c.currentTime:st.pos;}
function curP(){return Math.max(0,Math.min(1,curPos()/DUR[st.bank]));}
function resync(playIt){pauseAll();const els=activeEls();els.forEach(e=>{if(!e)return;try{e.currentTime=Math.max(0,Math.min(st.pos,(e.duration||DUR[st.bank])-0.03));}catch(x){}});applyGains();
  if(playIt)els.forEach(e=>{if(e)e.play().catch(()=>{});});st.playing=playIt;$("#play").innerHTML=playIt?"&#10074;&#10074;":"&#9654;";if(playIt)tick();else draw();}
function play(){st.pos=curPos();if(!activeEls()[0]){setStatus("Audio pas encore pret.");return;}resync(true);}
function pause(){st.pos=curPos();pauseAll();st.playing=false;$("#play").innerHTML="&#9654;";}
function stopPlay(){pauseAll();st.playing=false;st.pos=0;$("#play").innerHTML="&#9654;";try{activeEls().forEach(e=>{if(e)e.currentTime=0;});}catch(x){}draw();}
function switchBank(b){if(b===st.bank)return;const cur=curPos();const c=C();let np2;if(c.warp){np2=(b==="midi")?warpS2M(c,cur):warpM2S(c,cur);}else{np2=(cur/DUR[st.bank])*DUR[b];}
  st.bank=b;st.pos=np2;$("#abReal").classList.toggle("on",b==="real");$("#abMidi").classList.toggle("on",b==="midi");resync(st.playing);}
function fmt(s){s=Math.max(0,s|0);return (s/60|0)+":"+String(s%60).padStart(2,"0");}
let seeking=false;
function tick(){if(!st.playing)return;if(curPos()>=DUR[st.bank]-0.05){if(st.loop){st.pos=0;resync(true);}else{stopPlay();return;}}draw();requestAnimationFrame(tick);}
let svg=null,cursor=null,XP=[],activeIds=[];
function setupScore(){
  document.querySelectorAll('.score').forEach(d=>d.classList.remove('on'));
  const div=document.getElementById('score-'+st.cfg);div.classList.add('on');
  svg=div.querySelector('svg');svg.style.height=C().scoreH+'px';
  const old=svg.querySelector('#cursor');if(old)old.remove();
  cursor=document.createElementNS("http://www.w3.org/2000/svg","line");cursor.id="cursor";svg.appendChild(cursor);
  VBH=6600;const vb=svg.getAttribute("viewBox");if(vb){const a=vb.split(/\s+/).map(Number);VBH=a[3];VBW=a[2];}
  cursor.setAttribute("y1",0);cursor.setAttribute("y2",VBH);cursor.setAttribute("stroke-width",Math.round(VBW/850));
  buildX();
}
function buildX(){XP=PTS.filter(p=>p.on).map(p=>{let x=null;for(const id of p.on){const el=svg.querySelector('[id="'+id+'"]');if(el){try{const b=el.getBBox();x=b.x+b.width/2;break;}catch(e){}}}return {t:p.t,x:x,on:p.on};}).filter(p=>p.x!==null);activeIds=[];}
function xAtMs(ms){if(!XP.length)return 0;if(ms<=XP[0].t)return XP[0].x;if(ms>=XP[XP.length-1].t)return XP[XP.length-1].x;
  let lo=0,hi=XP.length-1;while(lo<hi-1){const m=(lo+hi)>>1;if(XP[m].t<=ms)lo=m;else hi=m;}const a=XP[lo],b=XP[hi],f=(ms-a.t)/Math.max(1,b.t-a.t);return a.x+f*(b.x-a.x);}
function highlight(ms){let idx=-1;for(let i=0;i<XP.length;i++){if(XP[i].t<=ms)idx=i;else break;}const ids=idx>=0?XP[idx].on:[];if(ids.join()===activeIds.join())return;
  activeIds.forEach(id=>{const e=svg.querySelector('[id="'+id+'"]');if(e)e.classList.remove("active");});ids.forEach(id=>{const e=svg.querySelector('[id="'+id+'"]');if(e)e.classList.add("active");});activeIds=ids;}
const box=()=>$("#scorebox");
function warpS2M(c,s){const w=c.warp;if(!w||!w.length)return s;if(s<=w[0][0])return w[0][1];if(s>=w[w.length-1][0])return w[w.length-1][1];let lo=0,hi=w.length-1;while(lo<hi-1){const m=(lo+hi)>>1;if(w[m][0]<=s)lo=m;else hi=m;}const a=w[lo],b=w[hi],f=(s-a[0])/Math.max(1e-6,b[0]-a[0]);return a[1]+f*(b[1]-a[1]);}
function warpM2S(c,mm){const w=c.warp;if(!w||!w.length)return mm;if(mm<=w[0][1])return w[0][0];if(mm>=w[w.length-1][1])return w[w.length-1][0];let lo=0,hi=w.length-1;while(lo<hi-1){const m=(lo+hi)>>1;if(w[m][1]<=mm)lo=m;else hi=m;}const a=w[lo],b=w[hi],f=(mm-a[1])/Math.max(1e-6,b[1]-a[1]);return a[0]+f*(b[0]-a[0]);}
function curMs(){const c=C();if(st.bank==="midi")return Math.min(curPos()*1000,MAXMS);if(c.warp)return Math.min(warpS2M(c,curPos())*1000,MAXMS);return curP()*MAXMS;}
function draw(){if(!svg)return;const ms=curMs(),x=xAtMs(ms);cursor.setAttribute("x1",x);cursor.setAttribute("x2",x);highlight(ms);
  const sw=svg.getBoundingClientRect().width;box().scrollLeft=(x/VBW)*sw-box().clientWidth*0.42;
  $("#time").textContent=fmt(ms/1000)+" / "+fmt(MAXMS/1000);if(!seeking)$("#seek").value=curP()*1000;}
function renderTracks(){const el=$("#tracks");el.innerHTML="";const anySolo=st.tr.some(x=>x.solo);const lg=document.documentElement.getAttribute('data-lang')||'fr';
  voices().forEach((v,i)=>{const dim=st.tr[i].muted||(anySolo&&!st.tr[i].solo);const row=document.createElement("div");row.className="track"+(dim?" dim":"");
    let nameHtml;
    if(v.kind==="toggle")nameHtml='<select class="tsel" data-ti="'+i+'">'+v.options.map(o=>'<option value="'+o.val+'"'+(st.sel[i]===o.val?" selected":"")+'>'+(lg==='en'?o.en:o.fr)+'</option>').join('')+'</select>';
    else nameHtml='<span class="tname">'+(lg==='en'?v.en:v.fr)+'</span>';
    row.innerHTML=nameHtml+'<button class="btn mute '+(st.tr[i].muted?"on":"")+'" data-m="'+i+'">M</button><button class="btn solo '+(st.tr[i].solo?"on":"")+'" data-s="'+i+'">S</button><input type="range" class="vol" min="0" max="1" step="0.01" value="'+st.tr[i].vol+'" data-v="'+i+'">';
    el.appendChild(row);});
  el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{st.tr[+b.dataset.m].muted^=1;applyGains();renderTracks();});
  el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{st.tr[+b.dataset.s].solo^=1;applyGains();renderTracks();});
  el.querySelectorAll("[data-v]").forEach(r=>r.oninput=()=>{st.tr[+r.dataset.v].vol=+r.value;applyGains();});
  el.querySelectorAll("[data-ti]").forEach(se=>se.onchange=()=>{const i=+se.dataset.ti;st.sel[i]=se.value;const p=curP();st.pos=p*DUR[st.bank];resync(st.playing);});
}
window.__relabel=renderTracks;
function selectCfg(id){const c=byId[id];if(!c)return;pauseAll();st.cfg=id;st.bank="real";st.pos=0;st.playing=false;
  st.sel={};c.voices.forEach((v,i)=>{if(v.kind==="toggle")st.sel[i]=v.default||v.options[0].val;});
  st.tr=c.voices.map(()=>({muted:false,solo:false,vol:1}));
  DUR=c.dur;MAXMS=c.maxms;VBW=c.vbw;PTS=TM[id];
  document.querySelectorAll('.pl-item').forEach(e=>e.classList.toggle('active',e.dataset.cfg===id));
  $("#mTitle").innerHTML=c.title+' <span class="subm">&middot; <span class="lang-fr">'+c.sub+'</span><span class="lang-en">'+c.subEn+'</span></span>';
  $("#mMeta").innerHTML=c.composer+' &middot; Symphonie n&#176;9 &laquo; Du Nouveau Monde &raquo;, Op. 95 (2<sup>e</sup> mouv.) &middot; <span class="lang-fr">arrangement :</span><span class="lang-en">arrangement:</span> '+c.arranger;
  $("#abReal").classList.add("on");$("#abMidi").classList.remove("on");$("#play").innerHTML="&#9654;";
  setupScore();renderTracks();draw();
}
$("#play").onclick=()=>{st.playing?pause():play();};
$("#stop").onclick=stopPlay;
$("#loop").onclick=e=>{st.loop=!st.loop;e.target.classList.toggle("on",st.loop);};
$("#abReal").onclick=()=>switchBank("real");
$("#abMidi").onclick=()=>switchBank("midi");
document.querySelectorAll('.pl-item').forEach(b=>b.onclick=()=>selectCfg(b.dataset.cfg));
const seek=$("#seek");
seek.addEventListener("input",()=>{seeking=true;const p=seek.value/1000;const ms=st.bank==="midi"?Math.min(p*DUR.midi*1000,MAXMS):(C().warp?Math.min(warpS2M(C(),p*DUR.real)*1000,MAXMS):p*MAXMS);$("#time").textContent=fmt(ms/1000)+" / "+fmt(MAXMS/1000);const x=xAtMs(ms);if(cursor){cursor.setAttribute("x1",x);cursor.setAttribute("x2",x);}});
seek.addEventListener("change",()=>{const p=seek.value/1000;seeking=false;st.pos=p*DUR[st.bank];resync(st.playing);});
initAudio();selectCfg(st.cfg);setStatus("Chargement...");
</script>
<script>(function(){function setLang(l){if(l!=='en')l='fr';document.documentElement.setAttribute('data-lang',l);document.documentElement.lang=l;try{localStorage.setItem('lang',l);}catch(e){}var b=document.querySelectorAll('.lang-switch button');for(var i=0;i<b.length;i++)b[i].classList.toggle('active',b[i].getAttribute('data-setlang')===l);if(window.__relabel){try{window.__relabel();}catch(e){}}}
document.addEventListener('DOMContentLoaded',function(){var b=document.querySelectorAll('.lang-switch button');for(var i=0;i<b.length;i++)b[i].addEventListener('click',function(){setLang(this.getAttribute('data-setlang'));});setLang(document.documentElement.getAttribute('data-lang')||'fr');});})();</script>
